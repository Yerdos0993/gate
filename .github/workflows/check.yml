name: VPN Gate Node Check

on:
  # 定时检测: 默认每 30 分钟一次。改成每 60 分钟: cron: "0 * * * *"
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: gate-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate BestCF parser and Gate Python syntax
        run: |
          python -m py_compile vpngate.py bestcf.py
          python -m unittest -v test_bestcf.py

      - name: Get VPN Gate nodes + check via Cloudflare Worker + build page
        run: python vpngate.py
        env:
          # 已部署的检测 Worker (不要改动: 检测统一走这里)
          CHECK_WORKER: "https://check.xiaoye.us.kg/check?sstp=vpn:vpn@"
          CHECK_CONCURRENCY: "32"
          CHECK_TIMEOUT: "90"
          EDT_UUID: ${{ secrets.EDT_UUID }}
          EDT_DOMAIN: ${{ secrets.EDT_DOMAIN }}
          # Optional manual IP:port override; otherwise fetch BestCF automatically.
          EDGE_HOSTS: ${{ vars.EDGE_HOSTS }}
          HOSTS_ENTRY: ${{ vars.HOSTS_ENTRY }}
          BESTCF_URL: https://bestcf.pages.dev/tiancheng/kr.txt
          BESTCF_ENABLED: ${{ vars.BESTCF_ENABLED }}

      - name: Ensure GitHub Pages is enabled (one-time auto setup)
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          echo "Pages API status: $code"
          if [ "$code" = "404" ]; then
            echo "首次运行: 启用 GitHub Pages (source = GitHub Actions, 目录 /public)"
            curl -sS -X PUT \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Content-Type: application/json" \
              -d '{"build_type":"workflow","source":{"branches":["main"],"path":"/public"}}' \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
            echo
            sleep 10
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

  deploy:
    name: Deploy GitHub Pages
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          for i in $(seq 1 12); do
            count=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length' 2>/dev/null || echo 0)
            if [ "$count" = "1" ]; then
              echo "Pages artifact visible via API."
              # Give Pages deployment metadata service time to observe the artifact.
              sleep 10
              exit 0
            fi
            echo "Pages artifact not yet visible (attempt $i/12)."
            sleep 5
          done
          echo "::error::Pages artifact was not found in this workflow run."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Show site URL
        run: 'echo "Published: ${{ steps.deployment.outputs.page_url }}"'
